name: Refresh sourced sweepstakes directory
on:
  schedule:
    - cron: "32 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4==4.12.3
      - run: python scripts/import_directory.py
      - name: Commit source-listed opportunities
        run: |
          git config user.name "sweepatlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory-leads.json
          git diff --cached --quiet || (git commit -m "Refresh unverified source-listed sweepstakes" && git push)
