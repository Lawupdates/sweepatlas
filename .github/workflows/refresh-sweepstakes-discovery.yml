name: Refresh sweepstakes discovery candidates
on:
  push:
    paths:
      - '.github/workflows/refresh-sweepstakes-discovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect research links
        run: python3 scripts/discover_sweepstakes.py
      - name: Save updated research feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery-candidates.json
          git diff --cached --quiet || (git commit -m 'Refresh sweepstakes research candidates' && git push)
