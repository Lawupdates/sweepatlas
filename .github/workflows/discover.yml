name: Discover sweepstakes candidates
on:
  push:
    branches: [main]
    paths:
      - "scripts/discover.py"
      - ".github/workflows/discover.yml"
  schedule:
    - cron: "11 0,4,8,12,16,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sweepatlas-discovery
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover candidate promotions
        run: python scripts/discover.py
        env:
          SWEEPATLAS_REPORT: data/discovery-candidates.json
      - name: Keep newest candidate queue in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh unverified sweepstakes discovery leads"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-candidates
          path: data/discovery-candidates.json
          if-no-files-found: warn
          retention-days: 14
