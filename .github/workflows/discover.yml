name: Discover sweepstakes candidates
on:
  push:
    branches: [main]
    paths:
      - "scripts/discover.py"
      - "scripts/audit_entries.py"
      - "scripts/resolve_entry_links.py"
      - "scripts/link_integrity.py"
      - ".github/workflows/discover.yml"
  schedule:
    - cron: "11 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sweepatlas-discovery
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover candidate promotions
        run: python scripts/discover.py
        env:
          SWEEPATLAS_REPORT: data/discovery-candidates.json
      - name: Search full backlog and save progress in six checkpoints
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in 1 2 3 4 5 6; do
            echo "Resolving entry links: batch $batch of 6"
            LOOKUP_BATCH=250 python scripts/resolve_entry_links.py
            python -c 'import json,pathlib; p=pathlib.Path("data/entry-lookup-results.json"); j=json.loads(p.read_text()); assert isinstance(j.get("results"),dict), "Missing results"; assert 0<=j.get("searched",0)<=j.get("total_source_records",0), "Bad counts"; print("Validated lookup batch:",j["searched"])'
            git add data/entry-lookup-results.json
            if ! git diff --cached --quiet; then
              git commit -m "Record entry link lookup batch $batch of 6"
              for attempt in 1 2 3; do
                git -c rebase.autoStash=true pull --rebase origin main
                if git push origin HEAD:main; then break; fi
                if [ "$attempt" = 3 ]; then exit 1; fi
                sleep $((attempt * 3))
              done
            fi
          done
      - name: Audit available entry pages without claiming confirmation
        run: python scripts/audit_entries.py
      - name: Audit direct entry URL integrity without changing public listings
        run: python scripts/link_integrity.py
      - name: Validate catalog and audit report integrity before publishing
        shell: bash
        run: |
          python scripts/check_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in (
              'data/discovery-candidates.json',
              'data/entry-audit.json',
              'data/entry-lookup-results.json',
              'data/link-integrity.json',
          ):
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty report: {filename}')
              with path.open(encoding='utf-8') as report:
                  parsed = json.load(report)
              if not isinstance(parsed, (dict, list)):
                  raise SystemExit(f'Unexpected report structure: {filename}')
              print(f'Checked report: {filename}')
          PY
      - name: Persist discovery and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-candidates.json data/entry-audit.json data/entry-lookup-results.json data/link-integrity.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh audited sweepstakes discovery leads"
            for attempt in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-candidates
          path: |
            data/discovery-candidates.json
            data/entry-audit.json
            data/entry-lookup-results.json
            data/link-integrity.json
          if-no-files-found: warn
          retention-days: 14
