name: Discover sweepstakes candidates
on:
  schedule:
    - cron: "41 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover.py
        env:
          SWEEPATLAS_REPORT: discovery-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-candidates
          path: discovery-candidates.json
          retention-days: 14
